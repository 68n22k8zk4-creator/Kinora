workflows:
  kinora-unsigned-ipa:
    name: KINORA – unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build (no signing)
        script: |
          set -e
          xcodebuild \
            -project KINORA.xcodeproj \
            -scheme KINORA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        script: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/KINORA.app"
          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP_PATH" Payload/
          zip -qry output/KINORA-unsigned.ipa Payload
          ls -la output
    artifacts:
      - output/*.ipa
