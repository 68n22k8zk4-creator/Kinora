name: KINORA
options:
  bundleIdPrefix: com.kinora
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  KINORA:
    type: application
    platform: iOS
    sources:
      - path: KINORA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinora.app
        PRODUCT_NAME: KINORA
        INFOPLIST_FILE: KINORA/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
